[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldscan"
version = "0.1.0"
description = "macOS filesystem scanner: directory sizes at every level and large duplicate folders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FoldScan" }]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
foldscan = "foldscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foldscan = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
